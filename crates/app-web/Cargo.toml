[package]
name = "app-web"
version = "0.1.0"
edition = "2024"

[dependencies]
sim-ui = { path = "../sim-ui" }
eframe = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
] }
console_error_panic_hook = "0.1.7"
