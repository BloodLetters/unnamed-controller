<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Unnamed Controller Simulator</title>
    <link data-trunk rel="rust" />
    <style>
        html { touch-action: none; }
        body {
            background: #202020;
            color: white;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Canvas takes up full screen */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="loading_text">Loading Simulator WebAssembly...</div>
    <canvas id="the_canvas_id"></canvas>
</body>
</html>
