[package]
name = "sim-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
sim-core = { path = "../sim-core" }
sim-components = { path = "../sim-components" }
rfd = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"

