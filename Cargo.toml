[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-components",
    "crates/sim-ui",
    "crates/app-desktop",
    "crates/app-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["unnamed-controller contributors"]
license = "MIT"

[workspace.dependencies]
# We will add shared dependencies here in the future.
egui = { version = "0.27", features = ["serde"] }
eframe = "0.27"
wgpu = "0.19"
web-time = "1.1"
log = "0.4"
